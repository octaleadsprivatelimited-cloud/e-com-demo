openapi: 3.1.0
info:
  title: Aster & Row Commerce API
  version: 1.0.0
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: Service health
      responses: { "200": { description: Healthy } }
  /api/v1/auth/register:
    post:
      summary: Register customer
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Register" } },
            },
        }
      responses:
        {
          "201": { description: Created },
          "400": { $ref: "#/components/responses/Error" },
        }
  /api/v1/auth/login:
    post:
      summary: Login and set rotating refresh cookie
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Credentials" } },
            },
        }
      responses:
        {
          "200": { description: Access token issued },
          "401": { $ref: "#/components/responses/Error" },
        }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh session
      responses:
        {
          "200": { description: Access token issued },
          "401": { $ref: "#/components/responses/Error" },
        }
  /api/v1/auth/logout:
    post:
      summary: Revoke refresh session
      responses: { "200": { description: Logged out } }
  /api/v1/products:
    get:
      summary: Search active products and variants
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
      responses: { "200": { description: Product list } }
  /api/v1/products/{id}:
    get:
      summary: Product details
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        {
          "200": { description: Product },
          "404": { $ref: "#/components/responses/Error" },
        }
  /api/v1/account/reviews:
    get:
      summary: List the signed-in customer's reviews and moderation status
      security: [{ bearerAuth: [] }]
      responses:
        {
          "200": { description: Customer reviews },
          "401": { $ref: "#/components/responses/Error" },
        }
    post:
      summary: Submit one product review for moderation
      security: [{ bearerAuth: [] }]
      responses:
        {
          "201": { description: Review submitted },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v1/account/payments:
    get:
      summary: List payment attempts, gateway references and refunds owned by the signed-in customer
      security: [{ bearerAuth: [] }]
      responses:
        {
          "200": { description: Customer payment history },
          "401": { $ref: "#/components/responses/Error" },
        }
  /api/v1/cart:
    get:
      summary: Read customer or guest cart
      responses: { "200": { description: Cart } }
  /api/v1/cart/items:
    put:
      summary: Add, update, or remove a cart line
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [variantId, quantity],
                      properties:
                        {
                          variantId: { type: string, format: uuid },
                          quantity: { type: integer, minimum: 0, maximum: 20 },
                        },
                    },
                },
            },
        }
      responses:
        {
          "200": { description: Cart updated },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v1/checkout/quote:
    post:
      summary: Calculate authoritative prices and available delivery services
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CheckoutQuote" } },
            },
        }
      responses:
        {
          "200": { description: Checkout quote calculated },
          "409": { $ref: "#/components/responses/Error" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /api/v1/checkout:
    post:
      summary: Price, reserve inventory, and create an order idempotently
      parameters:
        [
          {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, minLength: 8, maxLength: 100 },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Checkout" } },
            },
        }
      responses:
        {
          "201": { description: Order created },
          "409": { $ref: "#/components/responses/Error" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /api/v1/orders/{number}/track:
    get:
      summary: Track an order
      parameters:
        [{ in: path, name: number, required: true, schema: { type: string } }]
      responses:
        {
          "200": { description: Tracking history },
          "404": { $ref: "#/components/responses/Error" },
        }
  /api/v1/admin/products:
    get:
      summary: Search and paginate the complete admin catalog
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: status, schema: { type: string, enum: [ALL, DRAFT, ACTIVE, ARCHIVED], default: ALL } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: sortBy, schema: { type: string, enum: [updatedAt, name, inventory], default: updatedAt } }
        - { in: query, name: sortOrder, schema: { type: string, enum: [asc, desc], default: desc } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: Paginated product summaries and catalog facets }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create product with variants
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ProductWrite" } }
      responses:
        {
          "201": { description: Created },
          "403": { $ref: "#/components/responses/Error" },
        }
  /api/v1/admin/products/{id}:
    get:
      summary: Read a complete admin product, including inactive variants and inventory
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Admin product detail }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace product content while preserving stable variant and media identities
      description: Existing variants omitted from the request are deactivated, not deleted. Existing inventory is only changed through the inventory adjustment endpoint.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ProductWrite" } }
      responses:
        "200": { description: Product updated }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Archive a product without deleting its variants or order references
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Product archived }
  /api/v1/admin/products/{id}/media/upload:
    post:
      summary: Upload and convert a product image to WebP
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                alt: { type: string, maxLength: 200 }
                position: { type: integer, minimum: 0 }
                variantId: { type: string, format: uuid }
      responses:
        "201": { description: Optimized image attached }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/admin/products/{id}/media/order:
    put:
      summary: Atomically replace the media display order
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaIds]
              properties:
                mediaIds:
                  type: array
                  maxItems: 30
                  items: { type: string, format: uuid }
      responses:
        "200": { description: Ordered media }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/admin/products/{id}/media/{mediaId}:
    patch:
      summary: Update media alt text or variant assignment
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: path, name: mediaId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Media updated }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove media and compact remaining positions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: path, name: mediaId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Media removed }
  /api/v1/admin/categories:
    get:
      summary: List catalog categories and product counts
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
      responses:
        "200": { description: Category summaries }
  /api/v1/admin/inventory:
    get:
      summary: Search and paginate variant inventory
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: productId, schema: { type: string, format: uuid } }
        - { in: query, name: lowStock, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: Paginated inventory rows }
  /api/v1/admin/inventory/{variantId}:
    patch:
      summary: Idempotently adjust inventory and write an audit movement
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: variantId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/InventoryAdjustment" } }
      responses:
        "200": { description: Inventory, movement, and replay indicator }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/inventory/{variantId}/movements:
    get:
      summary: Read paginated inventory movement history
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: variantId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: Paginated inventory movements }
  /api/v1/admin/orders:
    get:
      summary: List sanitized live order-operation records
      description: Internal idempotency keys, tracking verification hashes, and provider secrets are never returned.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        {
          "200": { description: Paginated admin order DTOs with global summary counts },
          "403": { $ref: "#/components/responses/Error" },
        }
  /api/v1/admin/orders/{id}/status:
    patch:
      summary: Apply a validated non-payment order state transition
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/OrderStatusChange" } },
            },
        }
      responses:
        {
          "200": { description: Updated },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v1/admin/orders/{id}/refunds:
    post:
      summary: Create a cumulative, idempotent partial or full refund
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Id" },
          {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, minLength: 8, maxLength: 100 },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RefundRequest" } },
            },
        }
      responses:
        {
          "201": { description: Refund processed },
          "409": { $ref: "#/components/responses/Error" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /api/v1/admin/orders/{id}/shipment:
    post:
      summary: Idempotently create and persist a shipment for a packed order
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        {
          "201": { description: Shipment and updated sanitized order DTO },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v1/admin/integrations:
    get:
      summary: List masked integrations
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Integrations } }
    put:
      summary: Save encrypted provider credentials
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Saved } }
  /webhooks/{provider}:
    post:
      summary: Receive signed idempotent provider event
      parameters:
        - { in: path, name: provider, required: true, schema: { type: string } }
        - {
            in: header,
            name: X-Event-Id,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: X-Webhook-Signature,
            required: true,
            schema: { type: string },
          }
      responses:
        {
          "202": { description: Accepted },
          "401": { $ref: "#/components/responses/Error" },
        }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        {
          email: { type: string, format: email },
          password: { type: string, minLength: 8, maxLength: 128 },
        }
    Register:
      allOf:
        - { $ref: "#/components/schemas/Credentials" }
        - {
            type: object,
            required: [name],
            properties:
              { name: { type: string, minLength: 2, maxLength: 100 } },
          }
    ProductWrite:
      type: object
      required: [name, slug, description, category, status, taxRate, variants]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        description: { type: string, minLength: 10, maxLength: 20000 }
        category: { type: string, minLength: 2, maxLength: 100 }
        brand: { type: string, maxLength: 100 }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        taxRate: { type: number, minimum: 0, maximum: 100 }
        hsnCode: { type: string, pattern: "^[0-9]{4,8}$" }
        specifications: { type: object, additionalProperties: { type: string } }
        seoTitle: { type: string, maxLength: 70 }
        seoDescription: { type: string, maxLength: 170 }
        media:
          type: array
          maxItems: 30
          items:
            type: object
            required: [url, alt, type, position]
            properties:
              id: { type: string, format: uuid, description: Preserve this value when updating existing media. }
              url: { type: string, format: uri }
              alt: { type: string, maxLength: 200 }
              type: { type: string, enum: [IMAGE, VIDEO] }
              position: { type: integer, minimum: 0 }
              variantId: { type: string, format: uuid }
        variants:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [sku, title, price, mrp, stock, attributes, weightGrams]
            properties:
              id: { type: string, format: uuid, description: Preserve this value for an existing variant; omit it for a new variant. }
              sku: { type: string, minLength: 3, maxLength: 80 }
              title: { type: string, minLength: 1, maxLength: 120 }
              active: { type: boolean, default: true }
              price: { type: number, exclusiveMinimum: 0 }
              mrp: { type: number, exclusiveMinimum: 0 }
              stock: { type: integer, minimum: 0, description: Initial stock for new variants; ignored for existing variants. }
              attributes: { type: object, additionalProperties: { type: string } }
              weightGrams: { type: integer, minimum: 1 }
    InventoryAdjustment:
      type: object
      required: [quantity, reason]
      properties:
        quantity: { type: integer, minimum: -1000000, maximum: 1000000, not: { const: 0 } }
        reason: { type: string, minLength: 3, maxLength: 200 }
    Checkout:
      type: object
      required: [lines, postalCode, contact, shippingAddress, paymentProvider]
      properties:
        lines:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items:
              {
                type: object,
                required: [variantId, quantity],
                properties:
                  {
                    variantId: { type: string, format: uuid },
                    quantity: { type: integer, minimum: 1, maximum: 20 },
                  },
              },
          }
        postalCode: { type: string, pattern: "^[0-9]{6}$" }
        contact:
          type: object
          required: [name, email, phone]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
        shippingAddress:
          type: object
          required: [line1, city, state]
          properties:
            line1: { type: string }
            line2: { type: string }
            city: { type: string }
            state: { type: string }
            country: { type: string, default: IN }
        couponCode: { type: string }
        paymentProvider: { type: string }
        shippingService: { type: string, description: Service returned by the checkout quote }
    CheckoutQuote:
      type: object
      required: [lines, postalCode, paymentProvider]
      properties:
        lines:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items:
              {
                type: object,
                required: [variantId, quantity],
                properties:
                  {
                    variantId: { type: string, format: uuid },
                    quantity: { type: integer, minimum: 1, maximum: 20 },
                  },
              },
          }
        postalCode: { type: string, pattern: "^[0-9]{6}$" }
        couponCode: { type: string }
        paymentProvider: { type: string }
        shippingService: { type: string, description: Optional delivery service to price }
    OrderStatusChange:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Payment-authoritative states such as PAID and REFUNDED are rejected here.
    RefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        reason: { type: string, minLength: 3, maxLength: 500 }
  responses:
    Error:
      description: Standard error envelope
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  properties:
                    {
                      success: { const: false },
                      error:
                        {
                          type: object,
                          properties:
                            {
                              code: { type: string },
                              message: { type: string },
                            },
                        },
                    },
                },
            },
        }
