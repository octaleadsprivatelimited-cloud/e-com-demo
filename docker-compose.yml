version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: poltica_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poltica_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-poltica}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: poltica_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
