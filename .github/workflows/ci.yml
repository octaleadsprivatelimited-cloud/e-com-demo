name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: poltica
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
          
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: |
        cd apps/api && npm install
        cd ../web && npm install

    - name: Lint Frontend
      run: cd apps/web && npm run lint

    - name: Build Frontend
      run: cd apps/web && npm run build

    - name: Lint Backend
      run: cd apps/api && npm run lint

    - name: Build Backend
      run: cd apps/api && npm run build
